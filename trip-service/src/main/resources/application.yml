server:
  port: 8082

spring:
  application:
    name: trip-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taxi}
    username: ${SPRING_DATASOURCE_USERNAME:taxi}
    password: ${SPRING_DATASOURCE_PASSWORD:taxi}

integrations:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
  connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:1500}
  read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:3000}

pricing:
  tariff-per-km: ${TARIFF_PER_KM:37.50}

jwt:
  secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  expiration-minutes: 240
